name: Cresting Clouds Steam
description: Verify and execute a Cresting Clouds workflow reference
inputs:
  ref:
    description: Nimbus-signed, short-lived execution reference
    required: true
runs:
  using: composite
  steps:
    - name: Prepare runtime
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
    - name: Steam
      id: steam
      shell: bash
      env:
        INPUT_REF: ${{ inputs.ref }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js"

    - name: Publish authorization grant
      if: ${{ steps.steam.outputs.purpose == 'vscode-auth' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.steam.outputs.artifact-name }}
        path: ${{ steps.steam.outputs.artifact-path }}
        retention-days: 1
        if-no-files-found: error

    - name: Remove staged authorization grant
      if: ${{ always() && steps.steam.outputs.grant-root != '' }}
      shell: bash
      env:
        GRANT_ROOT: ${{ steps.steam.outputs.grant-root }}
        RUNNER_TEMP_ROOT: ${{ runner.temp }}
      run: |
        case "$GRANT_ROOT" in
          "$RUNNER_TEMP_ROOT"/cresting-clouds-grant-*) rm -rf -- "$GRANT_ROOT" ;;
          *) echo "::error::Invalid staged grant path"; exit 1 ;;
        esac
